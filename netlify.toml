[build]
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Ancien lien du menu KLIKY -> la page d'accueil
[[redirects]]
  from = "/menu/brunch-co"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/menu/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[headers]]
  for = "/assets/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/site.css"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/menu.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
